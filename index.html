<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Striver store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0 0 85px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #050507;
      color: #f3f3f6;
      overflow-x: hidden;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .store-header {
      background: linear-gradient(145deg, #121216, #09090c);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .store-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.25);
    }

    .store-name {
      font-size: 18px;
      font-weight: 800;
    }

    .store-status {
      font-size: 11px;
      color: #34d399;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .store-status::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: #34d399;
      border-radius: 50%;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      background: #111115;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 9px 15px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-chip.active {
      background: #2563eb;
      color: #ffffff;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .tab-content.active {
      display: flex;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .product-card {
      background: #131318;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    .card-photo-wrapper {
      width: 100%;
      height: 160px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      background: #1a1a1e;
    }

    .card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-title {
      font-size: 13px;
      font-weight: 700;
      height: 32px;
      overflow: hidden;
      cursor: pointer;
    }

    .product-price {
      font-size: 16px;
      font-weight: 800;
      color: #60a5fa;
    }

    .add-to-cart-btn {
      width: 100%;
      padding: 11px 0;
      background: #2563eb;
      color: #ffffff;
      border: none;
      font-weight: 700;
      font-size: 12px;
      border-radius: 13px;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(14px);
      z-index: 2000;
      justify-content: center;
      align-items: flex-end;
    }
    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #111115;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 16px 18px 32px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 96vh;
      overflow-y: auto;
    }

    .modal-close-btn {
      align-self: flex-end;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-slider {
      width: 100%;
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      background: #08080a;
    }

    .modal-slide {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: #8e8e93;
    }

    .custom-input {
      width: 100%;
      padding: 13px 18px;
      background: #16161b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 22px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .custom-input:focus {
      border-color: #2563eb;
    }

    .payment-card {
      background: #1b1b22;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
    }
    .payment-row .val {
      font-weight: 700;
      color: #60a5fa;
    }

    .cart-item {
      background: #131317;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remove-btn {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .cart-summary {
      background: #131317;
      padding: 16px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-total {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .empty-cart-text {
      text-align: center;
      color: #52525b;
      padding: 40px 0;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: rgba(12, 12, 16, 0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: #71717a;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .nav-item.active {
      color: #ffffff;
    }

    .badge {
      background: #fff;
      color: #000;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      font-size: 10px;
      font-weight: 800;
      display: none;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: -4px;
      right: -8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="store-header">
      <img src="ava.jpg" alt="Avatar" class="store-avatar">
      <div>
        <div class="store-name">Striver store</div>
        <div class="store-status">Онлайн · Отправка за 24h</div>
      </div>
    </div>

    <div class="categories-bar">
      <div class="cat-chip active" onclick="filterCategory('all', this)">Все товары</div>
      <div class="cat-chip" onclick="filterCategory('sneakers', this)">Обувь</div>
    </div>

    <div id="tab-products" class="tab-content active">
      <div class="products-grid">
        <div class="product-card" data-category="sneakers">
          <div class="card-photo-wrapper" onclick="openModal()">
            <img src="krosi_1.jpg" alt="Nike Air Force" class="card-photo">
          </div>
          <div class="product-title" onclick="openModal()">Nike Air Force 1 High (White)</div>
          <div class="product-price">6 990 ₽</div>
          <button class="add-to-cart-btn" onclick="openModal()">В корзину</button>
        </div>
      </div>
    </div>

    <div id="tab-cart" class="tab-content">
      <h2>Корзина</h2>
      <div id="cart-items-container">
        <div class="empty-cart-text">Корзина пуста</div>
      </div>
      
      <div id="cart-summary" class="cart-summary" style="display: none;">
        <div class="cart-total">
          <span>Итого:</span>
          <span id="cart-total-price">0 ₽</span>
        </div>
        <div class="form-group">
          <label class="form-label">Город:</label>
          <input type="text" id="inputCity" class="custom-input" placeholder="Москва">
        </div>
        <div class="form-group">
          <label class="form-label">Пункт выдачи (СДЭК):</label>
          <input type="text" id="inputPvz" class="custom-input" placeholder="СДЭК">
        </div>
        <div class="form-group">
          <label class="form-label">Адрес ПВЗ:</label>
          <input type="text" id="inputAddress" class="custom-input" placeholder="ул. Ленина 15">
        </div>
        <div class="form-group">
          <label class="form-label">Телефон:</label>
          <input type="tel" id="inputPhone" class="custom-input" placeholder="+7...">
        </div>
        <button class="add-to-cart-btn" style="padding: 14px 0;" onclick="openPaymentModal()">Перейти к оплате</button>
      </div>
    </div>
  </div>

  <div id="productModal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div style="font-size: 18px; font-weight: bold;">Nike Air Force 1 High (White)</div>
      <div class="modal-slider">
        <img src="krosi_1.jpg" class="modal-slide" alt="Товар">
      </div>
      <div class="product-price">6 990 ₽</div>
      <button class="add-to-cart-btn" onclick="addToCart('Nike Air Force 1', 6990); closeModal();">Добавить в корзину</button>
    </div>
  </div>

  <div id="paymentModal" class="modal" onclick="closePaymentModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close-btn" onclick="closePaymentModal()">✕</button>
      <div style="font-size: 18px; font-weight: bold;">Оплата заказа</div>
      <div class="payment-card">
        <div class="payment-row">
          <span>Банк:</span>
          <span class="val">Т-Банк</span>
        </div>
        <div class="payment-row">
          <span>Номер:</span>
          <span class="val">+7 920 104 5288</span>
        </div>
        <div class="payment-row">
          <span>К оплате:</span>
          <span class="val" id="payTotalVal">0 ₽</span>
        </div>
      </div>
      <button class="add-to-cart-btn" style="padding: 14px 0;" onclick="finishOrder()">Завершить оформление</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('products', this)">Каталог</button>
    <button class="nav-item" onclick="switchTab('cart', this)" style="position: relative;">
      Корзина
      <span id="cart-badge" class="badge">0</span>
    </button>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch (e) {}

    let cart = [];

    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
    }

    function openModal() { 
      document.getElementById('productModal').classList.add('active'); 
    }
    
    function closeModal() { 
      document.getElementById('productModal').classList.remove('active'); 
    }

    function openPaymentModal() {
      const city = document.getElementById('inputCity').value.trim();
      const phone = document.getElementById('inputPhone').value.trim();
      
      if (!city || !phone) {
        alert('Заполните город и телефон!'); 
        return;
      }
      
      let total = 0; 
      cart.forEach(i => total += i.price);
      document.getElementById('payTotalVal').innerText = total.toLocaleString() + ' ₽';
      document.getElementById('paymentModal').classList.add('active');
    }
    
    function closePaymentModal() { 
      document.getElementById('paymentModal').classList.remove('active'); 
    }

    function addToCart(title, price) {
      cart.push({ id: Date.now(), title, price });
      updateCartUI();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartUI();
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const container = document.getElementById('cart-items-container');
      const summary = document.getElementById('cart-summary');
      
      if (cart.length > 0) { 
        badge.innerText = cart.length; 
        badge.style.display = 'flex'; 
      } else { 
        badge.style.display = 'none'; 
      }

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart-text">Корзина пуста</div>';
        summary.style.display = 'none'; 
        return;
      }

      let html = '', total = 0;
      cart.forEach(i => {
        total += i.price;
        html += `
          <div class="cart-item">
            <div>
              <div>${i.title}</div>
              <div style="color: #60a5fa; font-size: 13px; font-weight: 700;">${i.price.toLocaleString()} ₽</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${i.id})">Удалить</button>
          </div>
        `;
      });
      
      container.innerHTML = html;
      document.getElementById('cart-total-price').innerText = total.toLocaleString() + ' ₽';
      summary.style.display = 'flex';
    }

    function finishOrder() {
      const orderData = {
        action: "new_order",
        items: cart.map(i => `- ${i.title} (${i.price} ₽)`).join('\n'),
        total: cart.reduce((s, i) => s + i.price, 0),
        city: document.getElementById('inputCity').value.trim(),
        pvz: document.getElementById('inputPvz').value.trim(),
        address: document.getElementById('inputAddress').value.trim(),
        phone: document.getElementById('inputPhone').value.trim()
      };

      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(orderData));
        tg.showAlert("✅ Заказ успешно оформлен! Менеджер свяжется с вами.", () => {
          tg.close();
        });
      } else {
        alert("Заказ сформирован (вне Telegram)!");
      }
    }
  </script>
</body>
</html>
