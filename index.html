<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            width: 300px;
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            height: 250px;
            background: #333;
            border-radius: 15px;
            object-fit: cover;
        }
        .title {
            font-size: 20px;
            margin: 15px 0 5px;
        }
        .price {
            font-size: 18px;
            color: #00ff88;
            margin-bottom: 15px;
        }
        .btn {
            background: #2ea6ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Место под картинку товара -->
        <div style="width:100%; height:250px; background:#444; border-radius:15px; display:flex; align-items:center; justify-content:center; color:#888;">Фото товара</div>
        <div class="title">Шмотка / Товар #1</div>
        <div class="price">5 000 ₽</div>
        <button class="btn" onclick="alert('Товар добавлен в корзину!')">В корзину</button>
    </div>

</body>
</html>
